[project]
name="causal_discovery_replication"
requires-python=">=3.12"
dependencies = [
    "causal-learn>=0.1.4.8",
    "causal_testing_framework == 15.0.0",
    "cdt>=0.6.0",
    "pgmpy>=1.1.2",
    "pre-commit>=4.6.1",
    "rpy2>=3.6.7",
    "torch>=2.13.0",
]
dynamic=["version"]

[tool.black]
# https://github.com/psf/black
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
